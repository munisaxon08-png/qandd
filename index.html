<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23FCE9E9'/%3E%3Crect x='25' y='25' width='50' height='50' rx='12' fill='none' stroke='%23C96772' stroke-width='6'/%3E%3Cpath d='M30 50 L42 50 L48 35 L54 65 L60 48 L70 48' fill='none' stroke='%23C96772' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--y:#FCE9E9;--g:#E2EEDF;--iv:#FFFDFC;--d:#8F3947;--p:#C96772;--pt:#2b1216;--tg:#2b1216;--bd:#f0d9d9;--card:#fff;--mut:#7a4a52;--rose:#8F3947;--rbg:#FCE9E9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--y:#4a2f35;--g:#35493a;--iv:#2a1d20;--d:#f6dfe0;--p:#d7808a;--tg:#f6dfe0;--bd:#52393f;--card:#35262a;--mut:#d1b3b7;--rose:#f0a39d;--rbg:#5a2a2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--iv);color:var(--d);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--iv);border-bottom:1px solid var(--bd);z-index:5}
.in{max-width:760px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center}.logo i{width:26px;height:26px;border-radius:50%;background:var(--g);display:inline-block;border:2px solid var(--d)}
main{max-width:760px;margin:auto;padding:16px 16px 110px}h1{font-size:26px;margin:4px 0 4px}h2{font-size:18px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0}
.hero{background:var(--y);border-color:transparent}.sub{color:var(--mut);margin:0 0 8px}.tip{background:var(--y);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--iv);color:var(--d);min-height:44px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--d);background:transparent;color:var(--d);padding:9px 14px;min-height:40px}
button.p{background:var(--p);border-color:var(--p);color:var(--pt)}button.g{background:var(--g);border-color:var(--g);color:var(--tg)}button.r{border-color:var(--rose);color:var(--rose)}button.sm{padding:5px 10px;min-height:32px;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.qa button{padding:14px;text-align:left;background:var(--card);border-color:var(--bd);font-weight:600}
.it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.it b{display:block}.m{color:var(--mut);font-size:14px}.act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;background:var(--g);color:var(--tg)}.tag.w{background:var(--y);color:var(--tg)}.tag.x{background:var(--rbg);color:var(--rose)}
.tag.rec{background:#DDEFD6;color:#2c5a2a}.tag.less{background:#FBF0C0;color:#66550d}.tag.not{background:#F8D6D3;color:#8a2a2f}[data-theme=dark] .tag.rec{background:#35543a;color:#e2f2dc}[data-theme=dark] .tag.less{background:#5a4d1d;color:#fbf0c0}[data-theme=dark] .tag.not{background:#5a2a2d;color:#f8d6d3}.qa svg.ic{color:var(--p);width:26px;height:26px;display:block;margin-bottom:6px}
.empty{text-align:center;color:var(--mut);padding:22px 8px;border:1px dashed var(--bd);border-radius:14px;margin:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{border:0;flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 2px;color:var(--mut)}nav button.on{background:var(--y);color:var(--d);font-weight:700}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--d);color:var(--iv);padding:10px 18px;border-radius:12px;z-index:9;display:none;max-width:90%}
#mod{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}#mod .card{max-width:420px;width:100%;max-height:90vh;overflow:auto}
.ov{overflow-x:auto}a{color:var(--d);font-weight:600}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button.on{background:var(--p);border-color:var(--p);color:var(--pt)}
</style></head><body>

<h2>${t('arts')}</h2>${ART.map(a=>`<div class="card"><b>${E(a[0])}</b><div class="m">${t('src')}: ${E(a[1])} · ${t('rev')}: 2026-10-29</div><p>${E(a[3])}</p><a href="${a[2]}" target="_blank" rel="noopener">${t('open')} ↗</a></div>`).join('')}`;
function fl(){if(!$('#fl'))return;const q=flt.q.toLowerCase(),i=S.lang=='ru'?2:S.lang=='uz'?3:1,L=FOOD.filter(f=>(flt.cat=='all'||cu(f)==flt.cat)&&f.slice(1,4).join(' ').toLowerCase().includes(q));
$('#fl').innerHTML=L.length?L.map(f=>{const r=RC[RT[f[1]]||'r'];return `<div class="card"><b>${E(f[i])}</b> <span class="tag ${r[1]}">${t(r[0])}</span><div class="m">${t('c_'+cu(f))} · ${t('serv')}: ${f[4]} · ${t('carb')}: ~${f[5]} g · ${t('fib')}: ~${f[6]} g</div><p style="margin:6px 0 0">${f[7]}</p></div>`}).join(''):`<div class="empty">${t('noRes')}</div>`}
function fl0(){const q=flt.q.toLowerCase(),i=S.lang=='ru'?2:S.lang=='uz'?3:1,L=FOOD.filter(f=>(flt.cat=='all'||f[0]==flt.cat)&&(f.slice(1,4).join(' ').toLowerCase().includes(q)));
$('#fl').innerHTML=L.length?L.map(f=>`<div class="card"><b>${E(f[i])}</b> <span class="tag w">${t(f[0])}</span><div class="m">${t('serv')}: ${f[4]} · ${t('carb')}: ~${f[5]} g · ${t('fib')}: ~${f[6]} g</div><p style="margin:6px 0 0">${f[7]}</p></div>`).join(''):`<div class="empty">${t('noRes')}</div>`}
V.meds=()=>{const e=S.meds.find(x=>x.id==ed.meds)||{times:[]},td=sched(),h=sorted(S.doses);
return `<h1>${t('meds')}</h1>${tip('tipM')}<form class="card" onsubmit="return sub(event,'meds')" novalidate>${e.id?`<span class="tag w">${t('dEdit')}</span>`:''}<div class="row"><div><label>${t('mname')} *</label><input name="name" value="${E(e.name)}"></div><div><label>${t('dose')} *</label><input name="dose" placeholder="e.g. 500 mg" value="${E(e.dose)}"></div></div><div class="row">${[0,1,2].map(i=>`<div><label>${t('t'+(i+1))}${i?'':' *'}</label><input type="time" name="t${i}" value="${e.times[i]||''}"></div>`).join('')}</div><p style="margin:12px 0 0"><button class="p">${e.id?t('save'):t('add')}</button> ${e.id?`<button type="button" onclick="ed={};render()">${t('cancel')}</button>`:''}</p></form>
<button class="sm" onclick="Notification.requestPermission().then(()=>toast('OK'))">🔔 ${t('notif')}</button> <span class="m">${t('hint')}</span>
<div>${S.meds.length?S.meds.map(m=>`<div class="card it" style="border-bottom:1px solid var(--bd)"><div><b>${E(m.name)}</b><span class="m">${E(m.dose)} · ${m.times.join(', ')}</span></div>${acts('meds',m.id)}</div>`).join(''):`<div class="empty">${t('noMeds')}</div>`}</div>
<h2>${t('todayD')}</h2><div class="card">${td.length?td.map(dline).join(''):`<div class="empty">${t('noMeds')}</div>`}</div>
<h2>${t('dh')}</h2><div class="card">${h.length?h.map(r=>`<div class="it"><div><b>${E(r.n)} · ${E(r.ds)}</b><span class="m">${r.d} · ${r.tm}</span></div><span class="tag ${r.st=='taken'?'':'x'}">${t(r.st)}</span></div>`).join(''):`<div class="empty">${t('noH')}</div>`}</div>`};
V.diary=()=>{const e=S.diary.find(x=>x.id==ed.diary)||{},n=ld(),L=sorted(S.diary);
return `<h1>${t('diary')}</h1>${tip('tipD')}<form class="card" onsubmit="return sub(event,'diary')" novalidate>${e.id?`<span class="tag w">${t('dEdit')}</span>`:''}<label>${t('sym')} *</label><input name="sym" value="${E(e.sym)}"><div class="row"><div><label>${t('date')} *</label><input type="date" name="d" value="${e.d||n.slice(0,10)}"></div><div><label>${t('time')} *</label><input type="time" name="tm" value="${e.tm||n.slice(11,16)}"></div><div><label>${t('sev')} *</label><select name="sev">${['mild','mod','str'].map(s=>`<option value="${s}" ${e.sev==s?'selected':''}>${t(s)}</option>`).join('')}</select></div></div><label>${t('rel')}</label><select name="med"><option value="">${t('none')}</option>${S.meds.map(m=>`<option ${e.med==m.name?'selected':''}>${E(m.name)}</option>`).join('')}</select><label>${t('note')}</label><textarea name="note" rows="2">${E(e.note)}</textarea><p style="margin:12px 0 0"><button class="p">${t('save')}</button> ${e.id?`<button type="button" onclick="ed={};render()">${t('cancel')}</button>`:''}</p></form>
<div class="card">${L.length?L.map(x=>`<div class="it"><div><b>${E(x.sym)} <span class="tag ${x.sev=='str'?'x':x.sev=='mod'?'w':''}">${t(x.sev)}</span></b><span class="m">${x.d} · ${x.tm}${x.med?' · 💊 '+E(x.med):''}${x.note?' · '+E(x.note):''}</span></div>${acts('diary',x.id)}</div>`).join(''):`<div class="empty">${t('noD')}</div>`}</div>`};
function sub(ev,ty){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),id=ed[ty]||uid();let r;
if(ty=='glu'){const v=parseFloat(String(f.v).replace(',','.')),mm=f.unit=='mmol/L';if(!f.v||!f.d||!f.tm)return toast(t('req')),false;if(isNaN(v)||(mm?(v<1||v>40):(v<20||v>700)))return toast(t('bad')),false;r={id,v,unit:f.unit,d:f.d,tm:f.tm,note:f.note}}
if(ty=='meds'){const ts=[f.t0,f.t1,f.t2].filter(Boolean);if(!f.name.trim()||!f.dose.trim()||!f.t0)return toast(t('req')),false;r={id,name:f.name.trim(),dose:f.dose.trim(),times:[...new Set(ts)].sort()}}
if(ty=='diary'){if(!f.sym.trim()||!f.d||!f.tm)return toast(t('req')),false;r={id,sym:f.sym.trim(),d:f.d,tm:f.tm,sev:f.sev,med:f.med,note:f.note}}
const i=S[ty].findIndex(x=>x.id==id);i<0?S[ty].push(r):S[ty][i]=r;ed={};save();toast('✓ '+t('saved'));render();return false}
function del(ty,id){if(!confirm(t('del')+'?'))return;S[ty]=S[ty].filter(x=>x.id!=id);save();toast(t('deleted'));render()}
function openSet(){const m=$('#mod');m.style.display='flex';m.innerHTML=`<div class="card"><h2 style="margin-top:0">${t('set')}</h2><label>${t('lang')}</label><div class="chips">${[['en','English'],['ru','Русский'],['uz','O‘zbekcha']].map(l=>`<button class="${S.lang==l[0]?'on':''}" onclick="S.lang='${l[0]}';save();render();openSet()">${l[1]}</button>`).join('')}</div><label>${t('mode')}</label><div class="chips">${['light','dark'].map(k=>`<button class="${(S.theme||'light')==k?'on':''}" onclick="S.theme='${k}';save();render();openSet()">${t(k)}</button>`).join('')}</div><label>${t('name')}</label><input value="${E(S.name)}" maxlength="30" oninput="S.name=this.value;save()"><p><button class="g" onclick="sample()">${t('sample')}</button> <button class="r" onclick="resetAll()">${t('reset')}</button></p><button class="p" onclick="closeSet()">${t('close')}</button></div>`}
function closeSet(){$('#mod').style.display='none';render()}
$('#mod').addEventListener('click',e=>{if(e.target.id=='mod')closeSet()});
function sample(){const b=new Date(),vals=[132,118,145,126,152,121,139,128];vals.forEach((v,i)=>{const d=new Date(b-(7-i)*864e5),s=new Date(d-d.getTimezoneOffset()*6e4).toISOString();S.glu.push({id:uid()+i,v,unit:'mg/dL',d:s.slice(0,10),tm:'08:00',note:'Sample'})});S.meds.push({id:uid(),name:'Sample Med A (fictional)',dose:'1 tablet',times:['08:00','20:00']});S.diary.push({id:uid(),sym:'Sample: mild headache',d:ld().slice(0,10),tm:'10:30',sev:'mild',med:'',note:'Sample'});save();toast(t('saved'));closeSet()}
function resetAll(){if(!confirm(t('resetQ')))return;const l=S.lang;S={name:'',lang:l,glu:[],meds:[],doses:[],diary:[]};save();toast(t('deleted'));closeSet()}
function render(){document.documentElement.lang=S.lang;document.documentElement.dataset.theme=S.theme||'light';$('#nav').innerHTML=P.map(p=>`<button class="${p==page?'on':''}" onclick="go('${p}')" aria-label="${t(p)}">${ic(p)}<span>${t(p)}</span></button>`).join('');$('#gear').setAttribute('aria-label',t('set'));$('#m').innerHTML=V[page]();if(page=='resources')fl()}
const fired={};setInterval(()=>{const n=ld().slice(11,16);sched().forEach(s=>{if(s.tm==n&&!s.st&&!fired[s.id]){fired[s.id]=1;const b=`${t('rem')}: ${s.m.name} (${s.m.dose})`;toast('🔔 '+b);try{if(Notification.permission=='granted')new Notification('Qand',{body:b})}catch(e){}}})},10000);
render();
</script></body></html>
